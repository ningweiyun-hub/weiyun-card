<style>
/* NEVE — Color tokens
   Calm, editorial palette. Base values first, semantic aliases below. */

:root {
  /* ---- Primary ---- */
  --neve-ink-navy: #0F172A;   /* Primary text, navigation, high-emphasis actions */
  --neve-dust-blue: #4C6B8A;  /* Secondary actions, calm highlights, charts */
  --neve-moss-green: #6B7F6B; /* Stable, supportive, completed states */
  --neve-warm-ivory: #F7F5F2; /* Main background and editorial surfaces */
  --neve-stone-grey: #E5E7EB; /* Borders, dividers, disabled states */

  /* ---- Accent ---- */
  --neve-muted-amber: #F2C48D;    /* Gentle attention and warnings */
  --neve-clay-orange: #E07A5F;    /* Important alerts and warm emphasis */
  --neve-soft-lavender: #B8B4D8;  /* AI, insight, guidance */

  /* ---- Semantic hues ---- */
  --neve-success: #2E7D5B;
  --neve-warning: #E6B450;
  --neve-error: #D87373;
  --neve-info: #4C86BA;

  /* ---- Neutral ramp (derived, for shadows/overlays/subtle fills) ---- */
  --neve-ivory-deep: #EFEBE5;  /* hover on ivory surfaces */
  --neve-ink-700: #1E293B;
  --neve-ink-500: #475569;
  --neve-ink-400: #64748B;
  --neve-ink-300: #94A3B8;
  --neve-white: #FFFFFF;

  /* ============ Semantic aliases ============ */

  /* Surfaces */
  --surface-page: var(--neve-warm-ivory);
  --surface-card: var(--neve-white);
  --surface-raised: var(--neve-white);
  --surface-sunken: var(--neve-ivory-deep);
  --surface-inverse: var(--neve-ink-navy);
  --surface-hover: var(--neve-ivory-deep);

  /* Text */
  --text-primary: var(--neve-ink-navy);
  --text-secondary: var(--neve-ink-500);
  --text-muted: var(--neve-ink-400);
  --text-inverse: var(--neve-white);
  --text-link: var(--neve-dust-blue);
  --text-on-accent: var(--neve-ink-navy);

  /* Borders & lines */
  --border-default: var(--neve-stone-grey);
  --border-strong: var(--neve-ink-300);
  --border-focus: var(--neve-dust-blue);

  /* Brand action colors */
  --action-primary: var(--neve-ink-navy);
  --action-primary-hover: var(--neve-ink-700);
  --action-secondary: var(--neve-dust-blue);
  --action-secondary-hover: #3F5B76;
  --action-accent: var(--neve-clay-orange);

  /* Feedback fills (tints for banners/badges) */
  --feedback-success-fg: var(--neve-success);
  --feedback-success-bg: #E6F0EA;
  --feedback-warning-fg: #9A6B12;
  --feedback-warning-bg: #FBF0D9;
  --feedback-error-fg: #B14A4A;
  --feedback-error-bg: #F7E4E4;
  --feedback-info-fg: var(--neve-info);
  --feedback-info-bg: #E2EDF5;
  --feedback-ai-fg: #5B567E;
  --feedback-ai-bg: #EEEDF6;
}
/* NEVE — Typography tokens */

:root {
  /* Families */
  --font-display: 'Instrument Serif', 'Georgia', 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;

  /* Weights */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;

  /* Sizes (from spec) */
  --text-caption: 12px;
  --text-small: 14px;
  --text-body: 16px;
  --text-h3: 20px;
  --text-h2: 28px;
  --text-h1: 40px;
  /* Display extensions for editorial hero type */
  --text-display: 64px;
  --text-display-lg: 88px;

  /* Line heights */
  --leading-tight: 1.2;
  --leading-normal: 1.4;
  --leading-relaxed: 1.5;

  /* Letter spacing — Instrument Serif likes a touch of air; Inter likes tight */
  --tracking-display: -0.01em;
  --tracking-heading: 0;
  --tracking-body: 0;
  --tracking-eyebrow: 0.14em; /* uppercase labels */
  --tracking-tight: -0.02em;
}

/* Convenience type classes used by cards, kits and slides */
.neve-display {
  font-family: var(--font-display);
  font-weight: var(--weight-regular);
  font-size: var(--text-display);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-display);
  color: var(--text-primary);
}
.neve-h1 {
  font-family: var(--font-display);
  font-weight: var(--weight-regular);
  font-size: var(--text-h1);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-display);
  color: var(--text-primary);
}
.neve-h2 {
  font-family: var(--font-display);
  font-weight: var(--weight-regular);
  font-size: var(--text-h2);
  line-height: var(--leading-tight);
  color: var(--text-primary);
}
.neve-h3 {
  font-family: var(--font-body);
  font-weight: var(--weight-semibold);
  font-size: var(--text-h3);
  line-height: var(--leading-normal);
  color: var(--text-primary);
}
.neve-body {
  font-family: var(--font-body);
  font-weight: var(--weight-regular);
  font-size: var(--text-body);
  line-height: var(--leading-relaxed);
  color: var(--text-secondary);
}
.neve-small {
  font-family: var(--font-body);
  font-weight: var(--weight-regular);
  font-size: var(--text-small);
  line-height: var(--leading-normal);
  color: var(--text-secondary);
}
.neve-caption {
  font-family: var(--font-body);
  font-weight: var(--weight-medium);
  font-size: var(--text-caption);
  line-height: var(--leading-normal);
  color: var(--text-muted);
}
.neve-eyebrow {
  font-family: var(--font-body);
  font-weight: var(--weight-semibold);
  font-size: var(--text-caption);
  line-height: var(--leading-normal);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  color: var(--text-muted);
}
/* NEVE — Spacing scale (4px base) */

:root {
  --space-0: 0px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 40px;
  --space-section: 64px;
  --space-page: 96px;

  /* Layout */
  --container-max: 1200px;
  --container-prose: 680px;
  --gutter: 24px;
}
/* NEVE — Radius, borders, shadows, sizing */

:root {
  /* Corner radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 999px;

  /* Border widths */
  --border-width: 1px;
  --border-width-focus: 2px;

  /* Elevation — soft, low, navy-tinted */
  --shadow-0: none;
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.08);
  --shadow-2: 0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-3: 0 12px 28px rgba(15, 23, 42, 0.14);
  /* Focus ring */
  --ring-focus: 0 0 0 3px rgba(76, 107, 138, 0.30);

  /* Sizing */
  --size-button-h: 40px;
  --size-input-h: 44px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
}
/* NEVE — Motion tokens
   Calm, never bouncy. One easing curve does almost everything. */

:root {
  --duration-fast: 120ms;   /* @kind other */
  --duration-normal: 180ms; /* @kind other */
  --duration-slow: 240ms;   /* @kind other */

  /* The NEVE curve: quick to leave, gentle to settle. */
  --ease-calm: cubic-bezier(0.2, 0, 0, 1); /* @kind other */

  --transition-base: all var(--duration-normal) var(--ease-calm);
  --transition-fast: all var(--duration-fast) var(--ease-calm);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;   /* @kind other */
    --duration-normal: 0ms; /* @kind other */
    --duration-slow: 0ms;   /* @kind other */
  }
}
/* Ported from the prototype's inline <style> in "My card.html". */

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--neve-warm-ivory);
  color: var(--text-primary);
  overflow: hidden;
}
#root { position: fixed; inset: 0; }

@keyframes nevePulse {
  0%, 100% { opacity: 0.4; transform: scale(0.85); }
  50%      { opacity: 1;   transform: scale(1.15); }
}
@keyframes neveRise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.neve-rise { animation: neveRise 520ms var(--ease-calm) both; }

.neve-navbtn {
  flex: 0 0 auto;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: var(--radius-full);
  background: var(--surface-card);
  border: 1px solid var(--border-default);
  box-shadow: var(--shadow-1);
  color: var(--neve-ink-navy);
  cursor: pointer;
  transition: var(--transition-fast);
}
.neve-navbtn:hover { box-shadow: var(--shadow-2); background: var(--surface-hover); }
.neve-navbtn:active { transform: scale(0.94); }

[data-rolecard]::-webkit-scrollbar { display: none; }
div::-webkit-scrollbar { display: none; }

@media (prefers-reduced-motion: reduce) {
  .neve-rise { animation: none; }
  .nevePulse { animation: none; }
}

/* Top-nav: inline links on desktop; collapse into a dropdown menu on mobile. */
.nav-links { display: flex; align-items: center; gap: clamp(10px, 2.4vw, 24px); }
.nav-burger { display: none; }

@media (max-width: 600px) {
  .nav-burger { display: flex; align-items: center; justify-content: center; }
  .nav-links {
    position: absolute; top: 54px; right: clamp(16px, 4vw, 40px);
    flex-direction: column; align-items: stretch; gap: 2px;
    min-width: 180px; padding: 8px;
    background: var(--surface-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    display: none;
  }
  .nav-links.open { display: flex; }
  .nav-links > button { width: 100%; text-align: left; padding: 11px 12px !important; border-radius: var(--radius-sm); }
  .nav-links > button:hover { background: var(--surface-hover); }
  /* The deck's prev/next arrows eat too much width on a phone, squeezing the
     card so it gets clipped. Hide them — the deck is swipeable by touch. */
  .deck-arrow { display: none !important; }
}

/* CV page ---------------------------------------------------------------- */
/* Narrow screens: one column, and the note opens inline under the station.
   Wide screens: the journey with the guide's note standing beside it;
   widest: years down the left edge as well. */
.cv-layout { display: block; }
.cv-margin { display: none; }
.cv-yearrail { display: none; }

.cv-note-inline { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 360ms var(--ease-calm); }
.cv-note-inline.open { grid-template-rows: 1fr; }
.cv-note-inline > div { overflow: hidden; }

@media (min-width: 1000px) {
  .cv-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: clamp(26px, 3.4vw, 50px); align-items: stretch; }
  /* stretch, not start: the column must be as tall as the journey or its
     sticky note has nowhere to travel and scrolls out of view. */
  .cv-margin { display: block; }
  .cv-note-inline { display: none; }
}
@media (min-width: 1280px) {
  .cv-layout { grid-template-columns: 58px minmax(0, 1fr) 320px; }
  .cv-yearrail { display: block; }
}

/* A station is focusable so the keyboard can walk the journey too. */
.cv-layout li:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 6px; border-radius: var(--radius-sm); }

@media (prefers-reduced-motion: reduce) {
  .cv-note-inline { transition: none; }
}

/* CV page: the "still being written" drawing (see UnderConstruction). */
@keyframes cvWipDraw { 0% { stroke-dashoffset: 116; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes cvWipPop { 0%, 12% { transform: scale(0); opacity: 0; } 28%, 100% { transform: scale(1); opacity: 1; } }
@keyframes cvWipRow { 0%, 16% { transform: scaleX(0); } 36%, 100% { transform: scaleX(1); } }
.cv-wip-draw { stroke-dasharray: 116; animation: cvWipDraw 5s var(--ease-calm) infinite; }
.cv-wip-node { transform-box: fill-box; transform-origin: center; animation: cvWipPop 5s var(--ease-calm) infinite; }
.cv-wip-row { transform-box: fill-box; transform-origin: left center; animation: cvWipRow 5s var(--ease-calm) infinite; }
.cv-wip-d1 { animation-delay: 0.5s; }
.cv-wip-d2 { animation-delay: 1s; }

@media (prefers-reduced-motion: reduce) {
  .cv-wip-draw, .cv-wip-node, .cv-wip-row { animation: none; stroke-dashoffset: 0; transform: none; opacity: 1; }
}
</style>

  blog: {

      { h: 'Context', p: `A user describes a long-term goal in their own words. Pace, the AI coach, turns it into a weekly direction, a measurable finish line for that week, and an action they can start today.

The current version is an AI-assisted iOS app built with Flutter, now in beta testing on TestFlight.` },
      { h: 'Design question', p: `Using AI is not the hard part. The design work is deciding where the line sits:

• What the AI should infer from a free-text goal
• What the user should confirm
• How much to generate at once
• How to reveal complexity progressively
• How users correct or override what the AI produced
• How a conversation changes planning compared with filling in a form` },
      { h: 'Early approach', p: `86400 began as a time-awareness app built around the 86,400 seconds in a day. It ran on pressure: a countdown that intensified through the evening, one Anchor task per day, and a companion pet that paid for an unfinished Anchor at midnight.

The first AI prototype kept much of the control on the system side. Pace created a weekly direction and one action for today. Onboarding came in two versions: one showed what Pace understood and let the user edit the plan field by field; the other let them adjust it by talking to Pace. Finishing a task meant passing a completion check, adding proof (a photo, a link, a written note, or self-confirmation only when no stronger proof existed), and then an end-of-day check-in before tomorrow's action was created.` },
      { h: 'What I changed and why', p: `• Pressure as the engine. The product's job is to make starting easier; a heating countdown and a pet at risk work against that. The companion now gives support and feedback, and is never used to shame or threaten.
• Asking for proof. The AI can help structure the work, but it should not become the authority deciding whether the user succeeded. Users now mark tasks complete or incomplete themselves, with no evidence required.
• A separate end-of-day check-in. Finishing all main tasks now settles the day and creates the next action; mood, notes and what I learned are optional.
• One action per day for every goal. It did not fit goals with independent tracks, such as language practice alongside job applications. The rule became: highlight one next action at a time, without forcing every day down to one main task.
• Two onboarding versions. Editing the plan field by field was retired; guided conversation is now the only way in.` },
      { h: 'Current interaction direction', p: `• Infer first, ask only when it matters. Pace extracts the outcome, success criteria, current baseline, deadline, milestones, dependencies, available days and time, and constraints from the user's own words. It asks a follow-up only when missing information would change the plan: one question at a time, never more than two, each with up to three quick answers plus Something else.
• Keep what the user said. Stated KPIs, deadlines and constraints must survive. A current state is never recorded as the goal: IELTS speaking at 5.5 today is a baseline; an IELTS overall score of 8 is the outcome. Dropping a stated detail counts as an AI failure, not a simplification.
• Reveal in layers. The plan summary shows the outcome, success criteria, deadline, weekly rhythm and near-term direction. Milestones and dependencies sit behind View plan details. Long-term stages are never pushed into Today all at once.
• Correct through conversation, once. During onboarding, the user tells Pace what it misunderstood or missed. Pace changes only what was asked and returns the same summary format. After onboarding, changes use structured controls (sessions per week, daily time, adding or removing main tasks) instead of reopening the conversation.
• The user decides what happened. Tasks are marked Complete, Incomplete or Skip for now, with no proof required. After an incomplete or low-capacity day, Pace scales the next action down.` },

• The order and wording of Pace's follow-up questions within the same guided flow.
• Whether people move from a confirmed plan to actually starting their first action.
• How many main tasks a day can hold before one highlighted next action stops being enough. This is still an open decision.` },

  const [src, setSrc] = React.useState(null);
  const [over, setOver] = React.useState(false);
  const inputRef = React.useRef(null);

  function read(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = () => setSrc(r.result);
    r.readAsDataURL(file);
  }

  return (
    <div
      onClick={() => inputRef.current?.click()}
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); setOver(false); read(e.dataTransfer.files?.[0]); }}
      style={{
        width: '100%', aspectRatio, display: 'block', marginBottom: 40,
        borderRadius: radius, overflow: 'hidden', cursor: 'pointer',
        background: src ? 'transparent' : 'var(--surface-sunken)',
        border: src ? '1px solid var(--border-default)'
                    : `1px dashed ${over ? 'var(--neve-dust-blue)' : 'var(--border-strong)'}`,
        transition: 'var(--transition-fast)',
      }}>
      {src ? (
        <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
      ) : (
        <div style={{
          width: '100%', height: '100%', display: 'grid', placeItems: 'center',
          fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--text-muted)',
          textAlign: 'center', padding: 24,
        }}>{placeholder}</div>
      )}
      <input ref={inputRef} type="file" accept="image/*" hidden
        onChange={(e) => read(e.target.files?.[0])} />
    </div>
  );
}

/* JourneyMap — the welcome screen: a 22-second looping flight from Taipei to
   Bournemouth, Amsterdam, Manchester and Rotterdam, with the camera pushing
   into Europe and every visited country tinting blue.

   Ported from the design handoff (design_handoff_journey_map). The handoff's
   own harness is not used: every frame is a pure function of the loop time T,
   driven by one requestAnimationFrame clock. d3 and topojson come from the
   same CDN as React; if either fails to load, the copy still renders over the
   plain ivory background. */

const W = 1920, H = 1080;
const C = {
  ink: '#0F172A', ink400: '#64748B', ivory: '#F7F5F2',
  stone: '#E5E7EB', white: '#FFFFFF', clay: '#E07A5F', dust: '#4C6B8A',
};
const SANS = 'Inter, system-ui, sans-serif';

/* ---- timeline ---------------------------------------------------------- */
const SECTIONS = [
  { name: 'Taiwan', dur: 3 },
  { name: 'Bournemouth', dur: 5 },
  { name: 'Amsterdam', dur: 3.5 },
  { name: 'Manchester', dur: 3.5 },
  { name: 'Rotterdam', dur: 3.5 },
  { name: 'Ending', dur: 3.5 },
];
const TOTAL = SECTIONS.reduce((a, s) => a + s.dur, 0); // 22s
const SPANS = (() => {
  const out = {}; let t = 0;
  SECTIONS.forEach((s) => { out[s.name] = [t, t + s.dur]; t += s.dur; });
  return out;
})();

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutCubic = (k) => 1 - Math.pow(1 - k, 3);
const easeInOutQuad = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeInOutCubic = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
/* value of one tween at time T */
const tween = (start, end, ease) => (T) => ease(clamp01((T - start) / Math.max(end - start, 1e-6)));
/* piecewise keyframes: times[] → values[] */
const interpolate = (times, values, ease) => (T) => {
  if (T <= times[0]) return values[0];
  for (let i = 1; i < times.length; i++) {
    if (T <= times[i]) {
      const k = ease(clamp01((T - times[i - 1]) / (times[i] - times[i - 1])));
      return values[i - 1] + (values[i] - values[i - 1]) * k;
    }
  }
  return values[values.length - 1];
};

/* ---- geography --------------------------------------------------------- */
const STOPS = [
  { id: 'tpe', city: '', iso: '158', lon: 121.56, lat: 25.03, dx: 16, dy: 8, anchor: 'start' },
  { id: 'bou', city: 'Bournemouth', iso: '826', lon: -1.88, lat: 50.72, dx: 0, dy: 30, anchor: 'middle' },
  { id: 'ams', city: 'Amsterdam', iso: '528', lon: 4.90, lat: 52.37, dx: 18, dy: -16, anchor: 'start' },
  { id: 'man', city: 'Manchester', iso: '826', lon: -2.24, lat: 53.48, dx: -18, dy: -16, anchor: 'end' },
  { id: 'rtm', city: 'Rotterdam', iso: '528', lon: 4.48, lat: 51.92, dx: 18, dy: 28, anchor: 'start' },
];
const N = 64;
const lerp = (a, b, k) => a + (b - a) * k;
const lerpP = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

/* Everything below needs d3; built once, when the library is there. */
function buildGeo() {
  const d3 = window.d3;
  if (!d3 || !d3.geoNaturalEarth1) return null;
  const proj = d3.geoNaturalEarth1().fitSize([W, H], { type: 'Sphere' });
  const geoPath = d3.geoPath(proj);
  const P = (s) => proj([s.lon, s.lat]);
  const sampleArc = (a, b) => {
    const ip = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
    const out = [];
    for (let i = 0; i <= N; i++) out.push(proj(ip(i / N)));
    return out;
  };
  const legs = STOPS.slice(1).map((to, i) => ({
    from: STOPS[i], to, section: SECTIONS[i + 1].name, pts: sampleArc(STOPS[i], to),
  }));
  const TPE = P(STOPS[0]);
  const EU = [1, 2, 3, 4].map((i) => P(STOPS[i]))
    .reduce((acc, p) => [acc[0] + p[0] / 4, acc[1] + p[1] / 4], [0, 0]);
  return {
    geoPath, P, legs, TPE, EU,
    sphereD: geoPath({ type: 'Sphere' }),
    WORLD: [W / 2, H / 2],
    C0: lerpP([W / 2, H / 2], TPE, 0.35),
  };
}

const legWindow = (leg) => { const [s, e] = SPANS[leg.section]; return [s + 0.4, e - 0.7]; };

/* Where the plane is, which way it points, how much of each leg is drawn. */
function runnerState(T, geo) {
  let pos = geo.TPE, angle = -30, running = false;
  const legK = [];
  geo.legs.forEach((leg) => {
    const [rs, re] = legWindow(leg);
    if (T < rs) { legK.push(0); return; }
    const k = easeInOutQuad(clamp01((T - rs) / Math.max(re - rs, 1e-6)));
    legK.push(k);
    const idx = k * N, i0 = Math.min(N - 1, Math.floor(idx)), i1 = i0 + 1;
    pos = lerpP(leg.pts[i0], leg.pts[i1], idx - i0);
    angle = Math.atan2(leg.pts[i1][1] - leg.pts[i0][1], leg.pts[i1][0] - leg.pts[i0][0]) * 180 / Math.PI;
    if (T > rs && T < re) running = true;
  });
  return { pos, angle, running, legK };
}

/* The camera is just a viewBox: zoom keyframes plus a centre that hands off
   from Taiwan to the plane to the European cluster. */
function camera(T, run, geo) {
  const [t0, t1] = SPANS.Taiwan, [b0, b1] = SPANS.Bournemouth, [e0, e1] = SPANS.Ending;
  const z = interpolate([t0, t1, b1, e0, e1], [1.25, 1.6, 12, 12.8, 9.5], easeInOutCubic)(T);
  const k1 = tween(b0, b0 + (b1 - b0) * 0.6, easeInOutCubic)(T);
  const k2 = tween(b0 + (b1 - b0) * 0.65, b1, easeInOutCubic)(T);
  const k3 = tween(e0, e1, easeInOutCubic)(T);
  const euTarget = lerpP(lerpP(geo.EU, run.pos, 0.15), geo.EU, k3);
  const c = lerpP(lerpP(geo.C0, run.pos, k1), euTarget, k2);
  return { z, cx: c[0], cy: c[1] + (0.09 * H) / z };
}

/* Side-view plane with a passenger, drawn nose-right and mirrored going west. */
function Plane({ angle, running, phase }) {
  const lift = running ? 18 : 0;
  const wobble = running ? Math.sin(phase) * 1.5 : 0;
  const facing = Math.cos(angle * Math.PI / 180) >= 0 ? 1 : -1;
  let tilt = facing === 1 ? angle : angle - 180;
  if (tilt < -180) tilt += 360;
  tilt = Math.max(-25, Math.min(25, tilt));
  const halo = { fill: 'none', stroke: C.white, strokeWidth: 3.5, strokeLinejoin: 'round' };
  const fuselage = 'M-17 -3.2 H9 Q17 -3.2 19 0 Q17 3.2 9 3.2 H-17 Q-20 0 -17 -3.2 Z';
  const fin = 'M-17 -3 L-13 -12 L-8 -12 L-9 -3 Z';
  const wing = 'M1 2.5 L-7 10 L-1 10 L6 2.5 Z';
  const torso = 'M-3.6 -3 L-3 -11 Q0 -13 3 -11 L3.6 -3 Z';
  return (
    <g>
      <ellipse cx="0" cy="0" rx={running ? 12 : 8} ry={running ? 4 : 3} fill={C.ink} opacity={running ? 0.1 : 0.14} />
      <g transform={`translate(0 ${-lift + wobble}) rotate(${tilt}) scale(${facing} 1) scale(1.15)`}>
        <g {...halo}>
          <path d={wing} /><path d={fin} /><path d={fuselage} />
          <path d={torso} transform="translate(2 0)" /><circle cx="2" cy="-15.5" r="3.6" />
        </g>
        <path d={wing} fill={C.ink400} />
        <path d={fin} fill={C.ink} />
        <path d={fuselage} fill={C.ink} />
        <circle cx="9" cy="-0.6" r="1.1" fill={C.white} />
        <path d={torso} fill={C.clay} transform="translate(2 0)" />
        <circle cx="2" cy="-15.5" r="3.6" fill={C.ink} />
      </g>
    </g>
  );
}

/* Pins and labels are drawn in screen pixels so the camera cannot inflate them. */
function Pin({ stop, at, T, z, P }) {
  const s = easeOutCubic(clamp01((T - at) / 0.5));
  const o = easeOutCubic(clamp01((T - at - 0.15) / 0.45));
  if (s <= 0) return null;
  const [x, y] = P(stop);
  return (
    <g transform={`translate(${x} ${y}) scale(${1 / z})`}>
      <circle r={10 * s} fill={C.white} />
      <circle r={6 * s} fill={C.clay} />
      {stop.city ? (
        <g opacity={o} transform={`translate(${stop.dx} ${stop.dy})`}>
          <text textAnchor={stop.anchor} fontFamily={SANS} fontSize="13" fontWeight="500"
            fill={C.ink400} letterSpacing="0.4">{stop.city}</text>
        </g>
      ) : null}
    </g>
  );
}

function JourneyMap({ onEnter }) {
  const [geo] = React.useState(() => buildGeo());
  const [land, setLand] = React.useState([]);
  const [T, setT] = React.useState(0);
  const reduced = typeof matchMedia !== 'undefined'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Country outlines, fetched once. A failure leaves the copy on plain ivory.
  React.useEffect(() => {
    if (!geo || !window.topojson) return;
    let alive = true;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')
      .then((r) => r.json())
      .then((topo) => {
        if (!alive) return;
        const fc = window.topojson.feature(topo, topo.objects.countries);
        setLand(fc.features.map((f, i) => ({ key: 'c' + i, id: String(f.id), d: geo.geoPath(f) })));
      })
      .catch(() => {});
    return () => { alive = false; };
  }, [geo]);

  // One clock. Reduced motion holds the last frame, where the whole route shows.
  React.useEffect(() => {
    if (!geo) return;
    if (reduced) { setT(SPANS.Ending[0] + 1.2); return; }
    let raf = 0;
    const t0 = performance.now();
    const step = (now) => {
      setT(((now - t0) / 1000) % TOTAL);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [geo, reduced]);

  let svg = null;
  if (geo) {
    const run = runnerState(T, geo);
    const cam = camera(T, run, geo);
    const vb = `${cam.cx - W / 2 / cam.z} ${cam.cy - H / 2 / cam.z} ${W / cam.z} ${H / cam.z}`;
    const arrive = [0.5].concat(geo.legs.map((l) => legWindow(l)[1]));
    const visited = { 158: arrive[0], 826: arrive[1], 528: arrive[2] };
    const trails = geo.legs.map((leg, i) => {
      const k = run.legK[i];
      if (k <= 0) return null;
      const idx = k * N, i0 = Math.min(N - 1, Math.floor(idx));
      const pts = leg.pts.slice(0, i0 + 1).concat([lerpP(leg.pts[i0], leg.pts[i0 + 1], idx - i0)]);
      return pts.map((p, j) => (j ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('');
    });
    // ivory wash in at the start of the loop and out at the end
    const fade = reduced ? 0
      : 1 - easeOutCubic(clamp01(T / 0.7)) + easeOutCubic(clamp01((T - (TOTAL - 0.7)) / 0.7));

    svg = (
      <React.Fragment>
        {/* fit, never crop: a clipped city label is worse than an ivory band */}
        <svg viewBox={vb} preserveAspectRatio="xMidYMid meet" aria-hidden="true" style={{
          position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block',
        }}>
          <path d={geo.sphereD} fill={C.white} stroke={C.stone} strokeWidth="1" vectorEffect="non-scaling-stroke" />
          {land.map((f) => (
            <path key={f.key} d={f.d} fill={C.stone} stroke={C.white} strokeWidth="0.8" vectorEffect="non-scaling-stroke" />
          ))}
          {land.filter((f) => visited[f.id] != null).map((f) => (
            <path key={'v' + f.key} d={f.d} fill={C.dust} stroke={C.white} strokeWidth="0.8"
              fillOpacity={0.32 * easeOutCubic(clamp01((T - visited[f.id]) / 0.6))}
              vectorEffect="non-scaling-stroke" />
          ))}
          {trails.map((d, i) => (d ? (
            <path key={'t' + i} d={d} fill="none" stroke={C.ink} strokeWidth="2" strokeDasharray="7 7"
              strokeLinecap="round" opacity="0.7" vectorEffect="non-scaling-stroke" />
          ) : null))}
          {STOPS.map((s, i) => <Pin key={s.id} stop={s} at={arrive[i]} T={T} z={cam.z} P={geo.P} />)}
          <g transform={`translate(${run.pos[0]} ${run.pos[1]}) scale(${1 / cam.z})`}>
            <Plane phase={T * 6} running={run.running} angle={run.angle} />
          </g>
        </svg>
        <div style={{
          position: 'absolute', inset: 0, background: C.ivory, pointerEvents: 'none',
          opacity: Math.max(0, Math.min(1, fade)),
        }} />
      </React.Fragment>
    );
  }

  return (
    <div data-screen-label="Welcome" style={{
      position: 'absolute', inset: 0, overflow: 'hidden', background: C.ivory,
    }}>
      {svg}

      {/* copy sits in the bottom-left, out of the flight path */}
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        padding: 'clamp(28px, 6vh, 64px) clamp(20px, 5vw, 72px)',
        background: 'linear-gradient(rgba(247,245,242,0) 0%, rgba(247,245,242,0.82) 46%, var(--neve-warm-ivory) 100%)',
      }}>
        <div style={{ maxWidth: 620 }}>
          <h1 style={{
            margin: '0 0 10px', fontFamily: 'var(--font-display)', fontWeight: 400,
            fontSize: 'clamp(34px, 6vw, 62px)', lineHeight: 1.04, letterSpacing: '-0.015em',
            color: 'var(--neve-ink-navy)',
          }}>Welcome to Neve's journey</h1>
          <p style={{
            margin: '0 0 22px', fontFamily: 'var(--font-body)',
            fontSize: 'clamp(15px, 1.5vw, 17px)', lineHeight: 1.6, color: 'var(--text-secondary)',
          }}>Creative, logical, and attuned to people. Now in the Netherlands.</p>
          <button onClick={onEnter} style={{
            display: 'inline-flex', alignItems: 'center', gap: 9,
            padding: '13px 26px', borderRadius: 'var(--radius-full)',
            background: 'var(--action-primary)', color: 'var(--text-inverse)',
            border: 'none', cursor: 'pointer', boxShadow: 'var(--shadow-1)',
            fontFamily: 'var(--font-body)', fontSize: 15, fontWeight: 500,
            transition: 'var(--transition-fast)',
          }}
            onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--action-primary-hover)'; e.currentTarget.style.boxShadow = 'var(--shadow-2)'; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = 'var(--action-primary)'; e.currentTarget.style.boxShadow = 'var(--shadow-1)'; }}>
            Come in
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.85" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

   BlogPost — blog-style case study for a single project. */

function PageShell({ label, children }) {

/* Icon for a contact item, keyed by `type`. 18px line icon, inherits color. */
function ContactIcon({ type }) {
  const common = { width: 17, height: 17, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round', style: { flexShrink: 0 } };
  if (type === 'email') return <svg {...common}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg>;
  if (type === 'phone') return <svg {...common}><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" /></svg>;
  if (type === 'link') return <svg {...common}><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5" /><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5" /></svg>;
  if (type === 'linkedin') return <svg {...common}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4V9h4v1.2A6 6 0 0 1 16 8Z" /><rect x="2" y="9" width="4" height="12" rx="1" /><circle cx="4" cy="4" r="2" /></svg>;
  if (type === 'instagram') return <svg {...common}><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="16.6" cy="7.4" r="1.1" fill="currentColor" stroke="none" /></svg>;
  return <svg {...common}><path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11Z" /><circle cx="12" cy="10" r="2.5" /></svg>; // text/location → pin
}

/* One contact row: icon + label, linked per type (mailto / tel / external / plain). */
function ContactRow({ item }) {
  const external = item.type === 'link' || item.type === 'instagram' || item.type === 'linkedin';
  const href = item.type === 'email' ? `mailto:${item.value}`
    : item.type === 'phone' ? `tel:${item.value}`
    : external ? item.value : null;
  const inner = (
    <>
      <ContactIcon type={item.type} />
      <span>{item.label}</span>
    </>
  );
  const base = {
    display: 'inline-flex', alignItems: 'center', gap: 9,
    fontFamily: 'var(--font-body)', fontSize: 14.5, lineHeight: 1.5,
    color: 'var(--text-secondary)', textDecoration: 'none',
  };
  if (!href) return <div style={{ ...base, color: 'var(--text-muted)' }}>{inner}</div>;
  return (
    <a href={href} target={external ? '_blank' : undefined} rel={external ? 'noopener noreferrer' : undefined}
      style={{ ...base, transition: 'var(--transition-fast)' }}
      onMouseEnter={(e) => { e.currentTarget.style.color = 'var(--neve-ink-navy)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.color = 'var(--text-secondary)'; }}>
      {inner}
    </a>
  );
}

}

/* Renders a text block: blank-line-separated paragraphs, plus consecutive
   lines starting with "• " grouped into a bullet list. */
function RichText({ text, size, lineHeight, marginBottom = 16 }) {
  const lines = String(text).split('\n');
  const blocks = [];
  let para = [], bullets = [];
  const flushPara = () => { if (para.length) { blocks.push({ type: 'p', text: para.join(' ') }); para = []; } };
  const flushBullets = () => { if (bullets.length) { blocks.push({ type: 'ul', items: bullets.slice() }); bullets = []; } };
  for (const raw of lines) {
    const line = raw.replace(/\t/g, ' ').trim();
    if (!line) { flushPara(); flushBullets(); continue; }
    const m = line.match(/^[••]\s*(.*)$/);
    if (m) { flushPara(); bullets.push(m[1]); }
    else { flushBullets(); para.push(line); }
  }
  flushPara(); flushBullets();

  const pStyle = {
    margin: `0 0 ${marginBottom}px`, fontFamily: 'var(--font-body)', fontSize: size,
    lineHeight, color: 'var(--text-secondary)', textWrap: 'pretty',
  };
  return blocks.map((b, i) => b.type === 'ul' ? (
    <ul key={i} style={{ ...pStyle, paddingLeft: 22 }}>
      {b.items.map((it, j) => <li key={j} style={{ marginBottom: 6 }}>{it}</li>)}
    </ul>
  ) : (
    <p key={i} style={pStyle}>{b.text}</p>
  ));
}

/* A paragraph string with ==marked== phrases rendered as highlighter spans

/* A demo clip inside a case study. It stays a still image until clicked:
   the file is only fetched then (preload="none"), and because the click is a
   user gesture the sound can play — which matters when the piece IS sound. */
function VideoFigure({ src, poster, caption }) {
  const [playing, setPlaying] = React.useState(false);
  const [hover, setHover] = React.useState(false);
  const ref = React.useRef(null);
  const start = () => {
    setPlaying(true);
    const v = ref.current;
    if (v) { v.play().catch(() => {}); }
  };
  return (
    <figure style={{ margin: '0 0 34px' }}>
      <div
        onClick={() => { if (!playing) start(); }}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          position: 'relative', borderRadius: 14, overflow: 'hidden',
          border: '1px solid var(--border-default)', background: 'var(--neve-ink-navy)',
          cursor: playing ? 'default' : 'pointer', lineHeight: 0,
        }}>
        <video
          ref={ref}
          src={coverSrc(src)}
          poster={coverSrc(poster)}
          preload="none"
          controls={playing}
          playsInline
          style={{
            width: '100%', display: 'block', aspectRatio: '1280 / 684',
            objectFit: 'cover', background: 'var(--neve-ink-navy)',
          }}
        />
        {!playing ? (
          <span style={{
            position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
            background: hover ? 'rgba(15,23,42,0.28)' : 'rgba(15,23,42,0.16)',
            transition: 'background 240ms var(--ease-calm)',
          }}>
            <span style={{
              display: 'inline-flex', alignItems: 'center', gap: 9,
              padding: '11px 20px', borderRadius: 'var(--radius-full)',
              background: 'var(--surface-card)', color: 'var(--neve-ink-navy)',
              fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 500,
              boxShadow: 'var(--shadow-2)',
              transform: hover ? 'scale(1.04)' : 'none',
              transition: 'transform 240ms var(--ease-calm)',
            }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
              Play with sound
            </span>
          </span>
        ) : null}
      </div>
      {caption ? (
        <figcaption style={{
          marginTop: 8, fontFamily: 'var(--font-body)', fontSize: 13,
          color: 'var(--text-muted)', textAlign: 'center', textWrap: 'pretty',
        }}>{caption}</figcaption>
      ) : null}
    </figure>
  );
}

/* CVPage — the CV as a guided walk instead of a downloadable PDF.
   One gap-free timeline from the first job to now (work, study, side roles
   and moves all on the same spine), and beside it a margin note in Weiyun's
   own voice explaining what the line the reader is pointing at really meant.

   Desktop: hover/focus a station → it lights up, the rest dim, the margin
   note swaps. Narrow screens have no hover, so the note opens inline on tap.
   All copy lives in `CV` (src/content.js). */

/* How each kind of station is drawn on the spine. */
const NODE = {
  work: { size: 13, fill: 'var(--neve-ink-navy)', ring: 'var(--neve-ink-navy)' },
  study: { size: 13, fill: 'var(--neve-dust-blue)', ring: 'var(--neve-dust-blue)' },
  side: { size: 9, fill: 'var(--surface-card)', ring: 'var(--neve-ink-300)' },
  build: { size: 13, fill: 'var(--neve-clay-orange)', ring: 'var(--neve-clay-orange)' },
  move: { size: 7, fill: 'var(--neve-warm-ivory)', ring: 'var(--neve-ink-300)' },
  gap: { size: 9, fill: 'var(--neve-warm-ivory)', ring: 'var(--neve-muted-amber)' },
  life: { size: 9, fill: 'var(--neve-warm-ivory)', ring: 'var(--neve-ink-300)' },
};
const isAside = (kind) => kind === 'side';
const isMarker = (kind) => kind === 'move' || kind === 'gap' || kind === 'life';
const startYear = (s) => ((s.period || '').match(/\d{4}/) || ['·'])[0];

/* Facts Weiyun still has to confirm — a placeholder never passes as a fact. */
function TodoBadge() {

}

/* The note itself — same markup in the margin (desktop) and inline (mobile). */
function Note({ station, compact }) {
  if (!station) return null;

/* One station on the journey. */
function Station({ station: s, cases, active, faded, onActivate, onOpenCase }) {
  const node = NODE[s.kind] || NODE.work;
  const aside = isAside(s.kind);
  const marker = isMarker(s.kind);
  const linked = (s.cases || []).map((id) => cases[id]).filter(Boolean);
  const groups = s.groups || (s.points ? [{ points: s.points }] : []);

  return (
    <li
      id={`cv-st-${s.id}`}
      tabIndex={0}
      onMouseEnter={() => onActivate(s.id)}
      onFocus={() => onActivate(s.id)}
      onClick={() => onActivate(s.id, true)}
      style={{
        position: 'relative',
        paddingLeft: aside ? 52 : 34,
        paddingBottom: marker ? 22 : 36,
        outline: 'none',
        cursor: 'default',
        opacity: faded ? 0.34 : 1,
        transition: 'opacity 320ms var(--ease-calm)',

      {/* branch line out to the side/parallel strands */}
      {aside ? (
        <span aria-hidden="true" style={{
          position: 'absolute', left: 6, top: 11, width: 30, height: 1,
          background: 'var(--border-default)',
        }} />
      ) : null}
      {/* node on the spine */}
      <span aria-hidden="true" style={{
        position: 'absolute',
        left: (aside ? 36 : 6) - node.size / 2,
        top: 11 - node.size / 2,
        width: node.size, height: node.size, borderRadius: '50%',
        background: node.fill,
        border: `2px ${marker ? 'dashed' : 'solid'} ${node.ring}`,
        boxShadow: `0 0 0 4px var(--neve-warm-ivory)${active ? ', 0 0 0 7px rgba(224,122,95,0.22)' : ''}`,
        transform: active ? 'scale(1.25)' : 'none',
        transition: 'transform 280ms var(--ease-calm), box-shadow 280ms var(--ease-calm)',
      }} />

      <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap', marginBottom: 3 }}>
        <span style={{
          fontFamily: 'var(--font-body)', fontSize: 12.5, fontWeight: 600, letterSpacing: '0.05em',
          color: active ? 'var(--neve-clay-orange)' : 'var(--neve-dust-blue)',
          transition: 'color 240ms var(--ease-calm)',
        }}>{s.period}</span>
        {s.place ? (
          <span style={{ fontFamily: 'var(--font-body)', fontSize: 12.5, color: 'var(--text-muted)' }}>
            · {s.place}

        {s.current ? (
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,

              width: 6, height: 6, borderRadius: '50%', background: 'var(--neve-success)',

      <h3 style={{

        fontWeight: marker ? 500 : 400,
        fontStyle: s.kind === 'gap' ? 'italic' : 'normal',
        fontSize: marker ? 15 : (aside ? 'clamp(19px, 2vw, 21px)' : 'clamp(22px, 2.6vw, 27px)'),
        lineHeight: 1.22,
        color: marker ? 'var(--text-muted)' : 'var(--neve-ink-navy)',
      }}>{s.role}</h3>
      {s.org ? (
        <div style={{
          fontFamily: 'var(--font-body)', fontSize: marker ? 13 : 14.5,
          fontWeight: marker ? 400 : 500,
          color: marker ? 'var(--text-muted)' : 'var(--text-secondary)',

        }}>{s.org}</div>

      {groups.map((g, gi) => (
        <div key={gi} style={{ marginTop: gi === 0 ? 10 : 12 }}>
          {g.heading ? (
            <div className="neve-eyebrow" style={{ color: 'var(--text-muted)', marginBottom: 5 }}>
              {g.heading}
            </div>
          ) : null}
          <ul style={{ margin: 0, padding: '0 0 0 17px', maxWidth: 620 }}>
            {g.points.map((pt, i) => (
              <li key={i} style={{

                color: 'var(--text-secondary)', marginBottom: 5, textWrap: 'pretty',

            ))}
          </ul>

      ))}

      {linked.length ? (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginTop: 12 }}>
          {linked.map((c) => (
            <button key={c.id} onClick={(e) => { e.stopPropagation(); onOpenCase(c.id); }} style={{
              display: 'inline-flex', alignItems: 'center', gap: 6,

            }}

              {c.title}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.85" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </button>
          ))}
        </div>
      ) : null}

      {/* the same note, inline — this is what a phone gets on tap */}
      <div className={'cv-note-inline' + (active ? ' open' : '')}>
        <div><Note station={s} compact /></div>
      </div>
    </li>
  );
}

function CVPage({ cases = {}, onOpenCase, onExplore, onSelectTab }) {
  const [activeId, setActiveId] = React.useState(null);
  const [readYear, setReadYear] = React.useState(startYear(CV.journey[0]));
  const [progress, setProgress] = React.useState(0);
  const spineRef = React.useRef(null);

  const active = CV.journey.find((s) => s.id === activeId) || null;
  const activate = (id, isClick) => setActiveId((cur) => (isClick && cur === id ? null : id));

  /* Years down the left edge — click one to travel to that point. */
  const years = [];
  CV.journey.forEach((s) => {
    const y = startYear(s);
    if (!years.some((r) => r.year === y)) years.push({ year: y, id: s.id });
  });

  /* The path fills in as you read — "how far along the journey am I". */
  React.useEffect(() => {
    const spine = spineRef.current;
    if (!spine) return;
    const scroller = spine.closest('[data-screen-label]');
    if (!scroller) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const r = spine.getBoundingClientRect();
      const p = (window.innerHeight * 0.52 - r.top) / Math.max(r.height, 1);
      setProgress(Math.max(0, Math.min(1, p)));
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    scroller.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      scroller.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  /* Which year the reader is standing in, for the year rail. */
  React.useEffect(() => {
    if (typeof IntersectionObserver === 'undefined') return;
    const els = CV.journey.map((s) => document.getElementById(`cv-st-${s.id}`)).filter(Boolean);
    if (!els.length) return;
    const io = new IntersectionObserver((entries) => {
      const seen = entries.filter((e) => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (!seen.length) return;
      const st = CV.journey.find((s) => `cv-st-${s.id}` === seen[0].target.id);
      if (st) setReadYear(startYear(st));
    }, { rootMargin: '-24% 0px -58% 0px', threshold: 0 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  const jump = (id) => {
    const el = document.getElementById(`cv-st-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  /* The tab still exists and still carries the header; only the timeline is
     swapped out. Flip CV.underConstruction in content.js to bring it back. */
  if (CV.underConstruction) {
    return (
      <PageShell label="CV">
        <div style={{
          maxWidth: 1240, margin: '0 auto',
          padding: 'clamp(88px, 12vh, 118px) clamp(20px, 5vw, 48px) 90px',
        }}>
          <h1 style={{
            margin: '0 0 6px', fontFamily: 'var(--font-display)', fontWeight: 400,
            fontSize: 'clamp(38px, 6.4vw, 64px)', lineHeight: 1.02, letterSpacing: '-0.015em',
            color: 'var(--neve-ink-navy)',
          }}>{ABOUT.name}</h1>
          <p style={{
            margin: '0 0 14px', fontFamily: 'var(--font-body)', fontSize: 'clamp(16px, 1.6vw, 19px)',
            fontWeight: 500, color: 'var(--neve-dust-blue)',
          }}>{CV.title}</p>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap', marginBottom: 4,
            fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--text-secondary)',
          }}>
            {CV.location ? (
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
                <ContactIcon type="pin" />{CV.location}
              </span>
            ) : null}
          </div>

          <AboutTabs active="cv" onSelect={onSelectTab} />
          <UnderConstruction />
        </div>
      </PageShell>
    );
  }

  return (
    <PageShell label="CV">
      <div style={{
        maxWidth: 1240, margin: '0 auto',
        padding: 'clamp(88px, 12vh, 118px) clamp(20px, 5vw, 48px) 90px',
      }}>
        {/* ---- header: name, role, place — nothing else competes with the walk ---- */}
        <h1 style={{
          margin: '0 0 6px', fontFamily: 'var(--font-display)', fontWeight: 400,
          fontSize: 'clamp(38px, 6.4vw, 64px)', lineHeight: 1.02, letterSpacing: '-0.015em',
          color: 'var(--neve-ink-navy)',
        }}>{ABOUT.name}</h1>
        <p style={{
          margin: '0 0 14px', fontFamily: 'var(--font-body)', fontSize: 'clamp(16px, 1.6vw, 19px)',
          fontWeight: 500, color: 'var(--neve-dust-blue)',
        }}>{CV.title}</p>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap', marginBottom: 4,
          fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--text-secondary)',
        }}>
          {CV.location ? (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
              <ContactIcon type="pin" />{CV.location}
            </span>
          ) : null}
          {CV.status ? <span>{CV.status}</span> : null}
        </div>

        <AboutTabs active="cv" onSelect={onSelectTab} />

        {/* ---- the journey ---- */}
        <div className="cv-layout">
          {/* years down the left edge */}
          <nav className="cv-yearrail" aria-label="Years">
            <div style={{ position: 'sticky', top: 128 }}>
              {years.map((y) => {
                const on = readYear === y.year;
                return (
                  <button key={y.year + y.id} onClick={() => jump(y.id)} style={{
                    display: 'block', width: '100%', padding: '5px 0', background: 'none', border: 'none',
                    cursor: 'pointer', textAlign: 'left',
                    fontFamily: 'var(--font-body)', fontSize: on ? 14 : 13,
                    fontWeight: on ? 600 : 400,
                    color: on ? 'var(--neve-clay-orange)' : 'var(--text-muted)',
                    transition: 'var(--transition-fast)',
                  }}>{y.year}</button>
                );
              })}
            </div>
          </nav>

          <div style={{ minWidth: 0 }} onMouseLeave={() => setActiveId(null)}>
            <div style={{ position: 'relative' }} ref={spineRef}>
              {/* the path: a quiet line, filled in as far as you have read */}
              <span aria-hidden="true" style={{
                position: 'absolute', left: 5, top: 10, bottom: 10, width: 1,
                background: 'var(--border-default)',
              }} />
              <span aria-hidden="true" style={{
                position: 'absolute', left: 5, top: 10, width: 1,
                height: `${(progress * 100).toFixed(2)}%`,
                maxHeight: 'calc(100% - 20px)',
                background: 'linear-gradient(var(--neve-clay-orange), var(--neve-dust-blue))',
                transition: 'height 120ms linear',
              }} />
              {/* the road starts at today and runs backwards from here */}
              <div style={{ position: 'relative', paddingLeft: 34, paddingBottom: 26 }}>
                <span aria-hidden="true" style={{
                  position: 'absolute', left: 0, top: 2, width: 11, height: 11, borderRadius: '50%',
                  background: 'var(--neve-clay-orange)',
                  boxShadow: '0 0 0 4px var(--neve-warm-ivory), 0 0 0 7px rgba(224,122,95,0.18)',
                }} />
                <span style={{
                  fontFamily: 'var(--font-body)', fontSize: 12.5, fontWeight: 600,
                  letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--neve-clay-orange)',
                }}>Today</span>
                <span style={{
                  fontFamily: 'var(--font-body)', fontSize: 13, color: 'var(--text-muted)', marginLeft: 10,
                }}>we walk backwards from here</span>
              </div>
              <ol style={{ listStyle: 'none', margin: 0, padding: 0 }}>
                {CV.journey.map((s) => (
                  <Station
                    key={s.id}
                    station={s}
                    cases={cases}
                    active={activeId === s.id}
                    faded={!!activeId && activeId !== s.id}
                    onActivate={activate}
                    onOpenCase={onOpenCase}
                  />
                ))}
              </ol>
            </div>
          </div>

          {/* the guide, standing beside the CV */}
          <aside className="cv-margin" aria-live="polite">
            <div style={{ position: 'sticky', top: 128, minHeight: 160 }}>
              {active ? <Note station={active} /> : (
                <p style={{
                  margin: 0, fontFamily: 'var(--font-body)', fontStyle: 'italic',
                  fontSize: 14.5, lineHeight: 1.7, color: 'var(--text-muted)',
                }}>{CV.noteIdle}</p>

            </div>
          </aside>
        </div>

        {/* ---- core expertise ---- */}
        <div style={{ marginTop: 26, paddingTop: 34, borderTop: '1px solid var(--border-default)' }}>

            margin: '0 0 22px', fontFamily: 'var(--font-display)', fontWeight: 400,

}

/* ============================================================================
   Role animations — six looping "identity" scenes (React + inline SVG, no deps).
   Ported from the NEVE design handoff. Renamed colour tokens NEVE → RAC to avoid
   clashing with the design-system object already named NEVE in this file; hooks
   use React.* so nothing is re-declared when the modules are concatenated into
   the no-build bundle.
   ========================================================================== */
const RAC = {
  ink: '#0F172A', ink300: '#94A3B8', dust: '#4C6B8A', moss: '#6B7F6B',
  ivory: '#F7F5F2', ivoryD: '#EFEBE5', stone: '#E5E7EB', white: '#FFFFFF',
  amber: '#F2C48D', amberD: '#D99A4E', clay: '#E07A5F', lav: '#B8B4D8',
};
const RA_SANS = 'Inter, system-ui, sans-serif';
const ra_clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const RA_Easing = {
  easeOutCubic: (t) => (--t) * t * t + 1,
  easeInCubic: (t) => t * t * t,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeOutBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function ra_pp(t, a, b, ease) {
  const r = ra_clamp((b - a) === 0 ? 0 : (t - a) / (b - a), 0, 1);
  return ease ? ease(r) : r;
}
function ra_fade(localTime, dur) {
  const inT = ra_pp(localTime, 0, 0.45, RA_Easing.easeOutCubic);
  const outT = ra_pp(localTime, dur - 0.4, dur, RA_Easing.easeInCubic);
  return inT * (1 - outT);
}

}
function ScenePodcaster({ s }) {

// 6 — Exhibition strategy designer: floor plan + visitor route
function ra_alongPath(pts, f) {
  let total = 0; const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const len = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
    segs.push(len); total += len;
  }
  let d = f * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i]) { const r = segs[i] ? d/segs[i] : 0; const a = pts[i], b = pts[i+1]; return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r]; }
    d -= segs[i];
  }
  return pts[pts.length-1];
}
function SceneExhibition({ s }) {
  const t = s.localTime;
  const plan = ra_pp(t, 0.35, 0.85, RA_Easing.easeOutCubic);
  const walls = ra_pp(t, 0.7, 1.15, RA_Easing.easeOutCubic);
  const art = ra_pp(t, 1.0, 1.55, RA_Easing.easeOutBack);
  const route = ra_pp(t, 1.4, 2.45, RA_Easing.easeInOutCubic);
  const pts = [[70,222],[70,80],[200,80],[200,170],[340,170],[340,80],[450,80],[450,222]];
  const routeD = 'M ' + pts.map(p => p.join(' ')).join(' L ');
  const dot = ra_alongPath(pts, route);
  const frames = [
    { x:118, y:46, w:40, h:12, c:RAC.clay },
    { x:248, y:46, w:40, h:12, c:RAC.dust },
    { x:384, y:46, w:40, h:12, c:RAC.amberD },
    { x:46, y:120, w:12, h:34, c:RAC.moss },
    { x:462, y:120, w:12, h:34, c:RAC.lav },
  ];
  return (
    <div style={{ position: 'relative', width: 520, height: 300 }}>
      <svg width="520" height="300" viewBox="0 0 520 300">
        <rect x="40" y="40" width="440" height="220" rx="6" fill={RAC.white} stroke={RAC.stone} strokeWidth="2"
          opacity={plan} transform={`scale(${0.96 + plan*0.04})`} style={{ transformOrigin: '260px 150px' }}/>
        <g stroke={RAC.ink} strokeWidth="5" strokeLinecap="round" opacity={walls}>
          <line x1="200" y1="40" x2="200" y2="130" />
          <line x1="340" y1="170" x2="340" y2="260" />
        </g>
        {frames.map((f, i) => (
          <rect key={i} x={f.x} y={f.y} width={f.w} height={f.h} rx="2" fill={f.c}
            opacity={art} transform={`scale(${art})`} style={{ transformOrigin: `${f.x+f.w/2}px ${f.y+f.h/2}px` }}/>
        ))}
        <path d={routeD} fill="none" stroke={RAC.dust} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          pathLength="1" strokeDasharray="1" strokeDashoffset={1 - route} opacity={0.9}/>
        <circle cx="70" cy="222" r="5.5" fill={RAC.ink} opacity={plan}/>
        {route > 0.02 && (
          <g>

            <circle cx={dot[0]} cy={dot[1]} r="6.5" fill={RAC.clay} stroke={RAC.white} strokeWidth="2"/>

// 7 — Creative technologist: flow field + plotted Lissajous curve + code lines
function SceneCreativeTechnologist({ s }) {
  const t = s.localTime;
  const board = ra_pp(t, 0.3, 0.8, RA_Easing.easeOutCubic);
  const field = ra_pp(t, 0.7, 2.0, RA_Easing.easeOutCubic);
  const curve = ra_pp(t, 1.45, 2.55, RA_Easing.easeInOutCubic);
  const ring = ra_pp(t, 2.2, 2.7, RA_Easing.easeOutCubic);
  const W = 480, H = 300, CX = 240, CY = 150;
  const cells = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 13; c++) {
    const x = 26 + c * 34, y = 22 + r * 34;
    const d = Math.hypot(x - CX, y - CY) / 268;
    const appear = ra_clamp((field - d * 0.55) / 0.45, 0, 1);
    if (appear <= 0) continue;
    const ang = Math.sin(x / 95 + y / 70 + t * 0.7) * 72 + 18;
    const len = 13 + 5 * Math.cos(x / 70 - y / 110 + t);
    cells.push({ k: r * 13 + c, x, y, ang, len, col: d < 0.33 ? RAC.lav : RAC.ivory, op: (0.22 + 0.5 * (1 - d)) * appear });
  }
  const N = 240, shown = Math.max(2, Math.round(N * curve));
  let path = '', hx = CX, hy = CY;
  for (let i = 0; i < shown; i++) {
    const k = (i / (N - 1)) * Math.PI * 2;
    hx = CX + 176 * Math.sin(3 * k + Math.PI / 2);
    hy = CY + 98 * Math.sin(4 * k);
    path += (i === 0 ? 'M' : 'L') + hx.toFixed(1) + ' ' + hy.toFixed(1) + ' ';
  }
  return (
    <div style={{ position: 'relative', width: 560, height: 344 }}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{
        position: 'absolute', left: 40, top: 0, borderRadius: 16,
        boxShadow: '0 22px 48px rgba(15,23,42,0.22)',
        opacity: board, transform: `scale(${0.96 + board * 0.04})`, transformOrigin: 'center',
      }}>
        <rect x="0" y="0" width={W} height={H} rx="16" fill={RAC.ink}/>
        <g transform={`rotate(${t * 1.4} ${CX} ${CY})`}>
          {cells.map((c) => (
            <line key={c.k}
              x1={c.x - (c.len / 2) * Math.cos(c.ang * Math.PI / 180)}
              y1={c.y - (c.len / 2) * Math.sin(c.ang * Math.PI / 180)}
              x2={c.x + (c.len / 2) * Math.cos(c.ang * Math.PI / 180)}
              y2={c.y + (c.len / 2) * Math.sin(c.ang * Math.PI / 180)}
              stroke={c.col} strokeWidth="1.5" strokeLinecap="round" opacity={c.op}/>
          ))}
        </g>
        {ring > 0 && [0, 1].map((i) => (
          <circle key={i} cx={CX} cy={CY} r={26 + ring * (78 + i * 52)} fill="none"
            stroke={RAC.lav} strokeWidth="1.4" opacity={0.55 * (1 - ring)}/>
        ))}
        {curve > 0 && (
          <g>
            <path d={path} fill="none" stroke={RAC.lav} strokeWidth="5" opacity="0.18" strokeLinecap="round"/>
            <path d={path} fill="none" stroke={RAC.lav} strokeWidth="1.8" strokeLinecap="round"/>
            <circle cx={hx} cy={hy} r="4.5" fill={RAC.white}/>
          </g>
        )}
        <text x="20" y="28" fill={RAC.ivory} opacity={0.42 * board}
          style={{ fontFamily: RA_SANS, fontSize: 10, fontWeight: 600, letterSpacing: '0.16em' }}>
          FIELD 04 · SEED 0427
        </text>
      </svg>
      <div style={{ position: 'absolute', left: 40, top: 316, display: 'flex', alignItems: 'center', gap: 8, opacity: board }}>
        {[[RAC.lav, 30], [RAC.ink300, 58], [RAC.stone, 26], [RAC.dust, 44], [RAC.stone, 34]].map(([col, w], i) => {
          const g = ra_clamp((ra_pp(t, 0.6, 2.1) - i * 0.15) / 0.3, 0, 1);
          return <span key={i} style={{ width: w * g, height: 6, borderRadius: 99, background: col }}></span>;
        })}
        <span style={{ width: 2, height: 11, background: RAC.ink, opacity: Math.floor(t * 2.2) % 2 ? 0.15 : 1 }}></span>
      </div>
    </div>
  );
}

// A looping rAF playhead in seconds; freezes to a settled frame when the user
// prefers reduced motion.
function useReelClock(total) {
  const [t, setT] = React.useState(0);
  const raf = React.useRef(null);
  React.useEffect(() => {
    const reduce = typeof window !== 'undefined' && window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setT(total * 0.7); return; }
    let last = null;
    const step = (ts) => {
      if (last == null) last = ts;
      const dt = (ts - last) / 1000; last = ts;
      setT((p) => (p + dt) % total);
      raf.current = requestAnimationFrame(step);
    };
    raf.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf.current);
  }, [total]);
  return t;
}

}

// Fills a card's media slot with the looping scene: ivory canvas (the scenes are
// drawn for a light ground), with the fixed 560×340 stage scaled to fit the slot.
const RA_STAGE_W = 560, RA_STAGE_H = 340;
function RoleAnimatedMedia({ animKey }) {
  const ref = React.useRef(null);
  const [w, setW] = React.useState(300);
  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    const update = () => setW(el.clientWidth || 300);
    update();
    let ro;
    if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(update); ro.observe(el); }
    else if (typeof window !== 'undefined') { window.addEventListener('resize', update); }
    return () => { if (ro) ro.disconnect(); else if (typeof window !== 'undefined') window.removeEventListener('resize', update); };
  }, []);
  const scale = w / RA_STAGE_W;
  return (
    <div ref={ref} style={{
      position: 'absolute', inset: 0, background: 'var(--neve-ivory-deep)', overflow: 'hidden',
      borderBottom: '1px solid rgba(15,23,42,0.06)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{ width: RA_STAGE_W, height: RA_STAGE_H, flex: '0 0 auto', transform: `scale(${scale})`, transformOrigin: 'center center' }}>
        <RoleScene animKey={animKey} width={RA_STAGE_W} height={RA_STAGE_H} />
      </div>
    </div>
  );
}

    t.scrollBy({ left: dir * step, behavior: 'smooth' });

    const t = trackRef.current;

    window.addEventListener('pointermove', move);

/* A history entry stores a snapshot of the view, and that snapshot can be
   months old — it survives content edits and even a rebuild. So whenever a
   view is restored, look the role and case up again by id and use today's
   copy; the stored object is only a fallback for something since deleted. */
const freshRole = (r) => (r && r.id ? (ROLES.find((x) => x.id === r.id) || r) : r);
const freshPost = (p, projects) => {
  if (!p || !p.id || !projects) return p;
  for (const list of Object.values(projects)) {
    const hit = (list || []).find((x) => x.id === p.id);
    if (hit) return hit;
  }
  return p;
};

/* Shareable URLs. Every view maps to a hash route so a case can be linked
   directly: #/case/<id>, #/portfolio/<roleId>, #/blog/<id>, #/about, …
   Hash (not path) routing because GitHub Pages is static — a path like
   /case/x would 404 on a fresh load. Intro/question have no hash. #admin is
   separate and handled by its own effect. */
const routeHash = (s) => {
  if (!s) return '';
  switch (s.stage) {
    case 'identity': return '#/portfolio';
    case 'role': return s.role ? `#/portfolio/${s.role.id}` : '#/portfolio';
    case 'post': return s.post ? `#/case/${s.post.id}` : '#/portfolio';
    case 'blog': return '#/blog';
    case 'blogpost': return s.blogPost ? `#/blog/${s.blogPost.id}` : '#/blog';
    case 'about': return '#/about';
    case 'cv': return '#/milestones';
    default: return '';
  }
};
const routeURL = (s) => location.pathname + location.search + routeHash(s);
// Hash → view snapshot, resolved against the published content; null when the
// hash isn't a route or names something that doesn't exist (or is hidden).
const parseRoute = (hash, projects, blog) => {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!hash || !hash.startsWith('#/') || !parts.length) return null;
  const view = (stage, patch = {}) => ({ stage, role: null, post: null, blogPost: null, ...patch });
  const [section, id] = parts;
  if (section === 'portfolio') {
    if (!id) return view('identity');
    const role = ROLES.find((r) => r.id === id);
    return role ? view('role', { role }) : null;
  }
  if (section === 'case' && id) {
    for (const role of ROLES) {
      const post = ((projects || {})[role.id] || []).filter(isPublished).find((p) => p.id === id);
      if (post) return view('post', { role, post });
    }
    return null;
  }
  if (section === 'blog') {
    if (!id) return view('blog');
    const blogPost = (blog || []).filter(isPublished).find((p) => p.id === id);
    return blogPost ? view('blogpost', { blogPost }) : null;
  }
  if (section === 'about') return view('about');
  if (section === 'milestones') return view('cv');
  return null;
};

function App() {
  // Restore the saved view on refresh / forward-nav (history.state survives reload).
  // A route in the URL (shared link, edited address bar) wins unless the saved
  // view already shows that same route — then keep it, it knows which role
  // the case was opened from.
  const [restored] = React.useState(() => {
    const saved = (typeof history !== 'undefined' && history.state && history.state._neve) ? history.state : null;
    if (typeof location === 'undefined' || !location.hash.startsWith('#/')) return saved;
    if (saved && routeHash(saved) === location.hash) return saved;
    const store0 = loadStore();
    return parseRoute(location.hash, effectiveRoleProjects(store0), effectiveBlog(store0)) || saved;
  });
  const [stage, setStage] = React.useState(restored ? restored.stage : 'intro'); // intro | question | identity | role | post | blog | blogpost | about | cv | admin
  const [source, setSource] = React.useState(null);
  const [role, setRole] = React.useState(restored ? freshRole(restored.role || null) : null);
  const [post, setPost] = React.useState(restored ? freshPost(restored.post || null, effectiveRoleProjects(loadStore())) : null); // open case study
  const [blogPost, setBlogPost] = React.useState(restored ? (restored.blogPost || null) : null);  // open blog article
  // Latest project data for the popstate handler, which is mounted once.
  const projectsRef = React.useRef(null);
  const blogRef = React.useRef(null);
  const [scrolled, setScrolled] = React.useState(false);
  const [answered, setAnswered] = React.useState(restored ? !['intro', 'question'].includes(restored.stage) : false); // questionnaire seen — skip it on return
  const [store, setStore] = React.useState(() => loadStore()); // localStorage content override

  // Effective (admin-edited or default) content; public views show only published.
  const roleProjects = effectiveRoleProjects(store);
  const currentProjects = role ? (roleProjects[role.id] || []).filter(isPublished) : [];
  const publishedBlog = effectiveBlog(store).filter(isPublished);

  projectsRef.current = roleProjects;
  blogRef.current = effectiveBlog(store);

  const persist = (next) => { setStore(next); saveStore(next); };

  // CV page: the cases it references, resolved against the published projects
  // so its links follow whatever the portfolio is currently showing.
  const cvCases = {}, cvCaseRole = {};
  Object.keys(roleProjects).forEach((rid) => {
    (roleProjects[rid] || []).filter(isPublished).forEach((p) => {
      if (cvCases[p.id]) return;
      cvCases[p.id] = p;
      cvCaseRole[p.id] = ROLES.find((r) => r.id === rid) || null;
    });
  });
  const openCaseFromCV = (id) => {
    if (cvCases[id] && cvCaseRole[id]) pushView('post', { role: cvCaseRole[id], post: cvCases[id] });
  };

  // ---- Browser-history navigation -------------------------------------
  // Each forward move pushes a history entry carrying a serializable snapshot
  // of the view, so the browser's native Back/Forward (and refresh) work.
  // Sections without sub-state (intro/identity/blog/about) de-dupe on re-click.
  const SINGLETON = ['intro', 'identity', 'blog', 'about', 'cv'];
  const pushView = (next, patch = {}) => {
    const { role: r = null, post: p = null, blogPost: bp = null } = patch;
    setStage(next); setRole(r); setPost(p); setBlogPost(bp);
    if (typeof history === 'undefined') return;
    const cur = history.state;
    if (cur && cur.stage === next && SINGLETON.includes(next)) return; // re-click same section
    const depth = ((cur && cur.depth) || 0) + 1;
    const snap = { stage: next, role: r, post: p, blogPost: bp, depth, _neve: true };
    history.pushState(snap, '', routeURL(snap));
  };
  // On-page "back" buttons defer to the browser history so it stays in sync;
  // if we're at the first entry (e.g. a deep-linked refresh) fall back explicitly.
  const goBack = (fallbackStage, fallbackPatch) => {
    if (typeof history !== 'undefined' && history.state && history.state.depth > 0) window.history.back();
    else pushView(fallbackStage, fallbackPatch);
  };

  const goPortfolio = () => pushView('identity');
  const goWelcome = () => pushView('intro');
  const goBlog = () => pushView('blog');
  // From the welcome page: first time → questionnaire; afterwards → straight to the deck.
  const enterFromWelcome = () => pushView(answered ? 'identity' : 'question');

  // Track scroll of whichever stage's scroll container is active (scroll doesn't
  // bubble, so listen in the capture phase to catch any descendant scroller).
  React.useEffect(() => {
    const onScroll = (e) => { setScrolled(((e.target && e.target.scrollTop) || 0) > 8); };
    document.addEventListener('scroll', onScroll, true);
    return () => document.removeEventListener('scroll', onScroll, true);
  }, []);
  // New stage always starts at the top — reset the nav to transparent.
  React.useEffect(() => { setScrolled(false); }, [stage]);

  // Seed a root history entry (only on a fresh visit) so the first Back leaves
  // the site rather than getting stuck, and Back/Forward restore saved views.
  React.useEffect(() => {
    if (typeof history === 'undefined') return;
    // The entry must hold the view actually shown — a deep link or an edited
    // hash has no saved state, or a stale one.
    const cur = history.state;
    if (!(cur && cur._neve) || (location.hash.startsWith('#/') && routeHash(cur) !== location.hash)) {
      const view = restored || { stage: 'intro', role: null, post: null, blogPost: null };
      const snap = { stage: view.stage, role: view.role, post: view.post, blogPost: view.blogPost, depth: view.depth || 0, _neve: true };
      history.replaceState(snap, '', location.hash === '#admin' ? undefined : routeURL(snap));
    }
    const onPop = (e) => {
      let s = (e.state && e.state._neve) ? e.state : null;
      if (!s && location.hash.startsWith('#/')) {
        // Hash typed into the address bar: no saved view, so resolve the route
        // and store it on this entry (Back still returns to the previous one).
        const route = parseRoute(location.hash, projectsRef.current, blogRef.current);
        if (route) {
          s = { ...route, depth: 1, _neve: true };
          history.replaceState(s, '', routeURL(s));
        }
      }
      if (!s) {
        s = { stage: 'intro', role: null, post: null, blogPost: null };
        // Unknown route (typo, deleted case): show the welcome, drop the bad hash.
        if (location.hash.startsWith('#/')) history.replaceState({ ...s, depth: 1, _neve: true }, '', routeURL(s));
      }
      setStage(s.stage); setRole(freshRole(s.role || null));
      setPost(freshPost(s.post || null, projectsRef.current)); setBlogPost(s.blogPost || null);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const chromeless = stage === 'intro';

  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      {!chromeless ? (
        <NavBar
          stage={stage}
          scrolled={scrolled}
          onWordmark={goWelcome}
          onPortfolio={goPortfolio}
          onBlog={goBlog}
          onAbout={() => pushView('about')}
        />
      ) : null}

      <div style={{ position: 'absolute', inset: 0, opacity: stage === 'intro' ? 1 : 0, pointerEvents: stage === 'intro' ? 'auto' : 'none', transition: 'opacity 500ms var(--ease-calm)' }}>
        {stage === 'intro' ? <JourneyMap onEnter={enterFromWelcome} /> : null}
      </div>

      {stage === 'question' ? (
        <QuestionCard onSubmit={(s) => { setSource(s); logSurvey(s); setAnswered(true); pushView('identity'); }} />
      ) : null}

      {stage === 'identity' ? (
        <IdentityDeck onChoose={(r) => pushView('role', { role: r })} />
      ) : null}

      {stage === 'role' && role ? (
        <RolePage
          role={role}
          projects={currentProjects}
          onBack={() => goBack('identity')}
          onOpenPost={(p) => pushView('post', { role, post: p })}
        />
      ) : null}

      {stage === 'post' && role && post ? (
        <BlogPost
          role={role}
          post={post}
          backLabel={role.title}
          onBack={() => goBack('role', { role })}
        />
      ) : null}

      {stage === 'blog' ? (
        <BlogList
          posts={publishedBlog}
          onOpen={(p) => pushView('blogpost', { blogPost: p })}
        />
      ) : null}

      {stage === 'blogpost' && blogPost ? (
        <BlogPost
          post={blogPost}
          backLabel="All writing"
          onBack={() => goBack('blog')}
        />
      ) : null}

      {stage === 'about' ? (
        <AboutPage onExplore={goPortfolio} onSelectTab={(id) => pushView(id)} />
      ) : null}

      {stage === 'cv' ? (
        <CVPage
          cases={cvCases}
          onOpenCase={openCaseFromCV}
          onExplore={goPortfolio}
          onSelectTab={(id) => pushView(id)}
        />
      ) : null}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
